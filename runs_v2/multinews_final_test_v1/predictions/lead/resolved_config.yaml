experiment:
  status: final_test_only
  dataset: Multi-News
data_policy:
  policy_path: configs/data_policies/multinews_test_v1.json
  policy_sha256: 95d9ea7cb664f50175c6964f2272c76fda37ea2a3141b51ce268c4cfef9b7ef2
  analysis: main
seed: 3407
features:
  tf_isf:
    version: v2
    use_stopwords: true
    use_sublinear_tf: true
    use_bigrams: true
  position:
    scope: document
    version: v2
    method: inverse
    decay: 0.1
  fusion:
    version: v1
    interactions: []
  weights:
    importance: 1.0
    length: 0.0
    position: 0.2
    graph: 0.0
    centrality: 0.0
    novelty: 0.0
representations:
  use: true
  method: tfidf
compute_budget:
  mode: fixed
  enabled_routes:
  - lexical
  - semantic
  - graph
candidate_budget:
  route_top_k: 40
  min_per_route: 20
  total: 80
candidates:
  use: true
  mode: hard
  soft_boost: 1.05
  rrf_constant: 60
  route_weights:
    graph: 2.0
selector:
  salience_source: rrf_fusion
  similarity_source: pipeline_similarity
objectives:
  importance_aggregation: length_normalized
  coverage_method: max
  lambda_importance: 1.0
  lambda_coverage: 0.8
  lambda_redundancy: 0.7
routes:
  lexical:
    revision: tf_isf_v2:smooth_nonnegative_sublinear_unigram
  tfidf_centroid:
    sublinear_tf: true
    ngram_range:
    - 1
    - 2
  graph:
    implementation: sparse_knn
    n_neighbors: 8
    min_similarity: 0.05
    alpha: 0.85
    max_iter: 100
    tol: 1.0e-06
  semantic:
    model_name: sentence-transformers/all-MiniLM-L6-v2
    revision: c9745ed1d9f207416be6d2e6f8de32d1f16199bf
    device: cpu
    batch_size: 32
    max_model_tokens: 256
coverage_guard:
  enabled: true
  document: true
  section: false
  position: false
  max_items: 20
optimizer:
  method: greedy
length_control:
  unit: words
  min_words: 200
  max_words: 250
  require_nonempty: true
baselines:
  pacsum:
    beta: 0.0
    lambda_previous: -0.8
    lambda_following: 0.2
    tfidf:
      lowercase: true
      sublinear_tf: false
      ngram_range:
      - 1
      - 1
      stop_words: null
  sbert_mmr:
    lambda_relevance: 0.7
final_protocol:
  study_id: multinews-secondary-final-evaluation-v1
  authorization_path: configs/data_policies/multinews_test_authorization_v1.json
  one_shot: true
  scientific_source_config_path: runs_v2/d3b_cross_profile_combination_v1/multinews/dev/C01_combined_salience_route_weight/resolved_config.yaml
  scientific_source_config_sha256: a7adc739041e5f16ae322fd9ee55ae1ecb18b07a023d5c0a35e81342aff3911f
