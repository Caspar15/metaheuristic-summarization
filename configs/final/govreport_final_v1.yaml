experiment:
  status: final_test_only
  dataset: GovReport
data_policy:
  policy_path: configs/data_policies/govreport_test_v1.json
  policy_sha256: ec40dd062baaebe856f8dbe13e61335437a476c982e4c38a2011aa4a773b2575
  analysis: main
seed: 3407
features:
  tf_isf:
    version: v2
    use_stopwords: true
    use_sublinear_tf: true
    use_bigrams: true
  position:
    scope: document
    version: v2
    method: inverse
    decay: 0.1
  fusion:
    version: v1
    interactions: []
  weights:
    importance: 1.0
    length: 0.0
    position: 0.2
    graph: 0.0
    centrality: 0.0
    novelty: 0.0
representations:
  use: true
  method: tfidf
compute_budget:
  mode: fixed
  enabled_routes: [lexical, semantic, graph]
candidate_budget:
  route_top_k: 40
  min_per_route: 20
  total: 80
candidates:
  use: true
  mode: hard
  soft_boost: 1.05
  rrf_constant: 60
  route_weights:
    lexical: 0.5
selector:
  salience_source: rrf_fusion
  similarity_source: pipeline_similarity
objectives:
  importance_aggregation: length_normalized
  coverage_method: max
  lambda_importance: 1.0
  lambda_coverage: 0.8
  lambda_redundancy: 0.7
routes:
  lexical:
    revision: tf_isf_v2:smooth_nonnegative_sublinear_unigram
  tfidf_centroid:
    sublinear_tf: true
    ngram_range: [1, 2]
  graph:
    implementation: sparse_knn
    n_neighbors: 8
    min_similarity: 0.05
    alpha: 0.85
    max_iter: 100
    tol: 0.000001
  semantic:
    model_name: sentence-transformers/all-MiniLM-L6-v2
    revision: c9745ed1d9f207416be6d2e6f8de32d1f16199bf
    device: cpu
    batch_size: 32
    max_model_tokens: 256
coverage_guard:
  enabled: true
  document: true
  section: false
  position: false
  max_items: 20
optimizer:
  method: mmr
  lambda_relevance: 0.7
length_control:
  unit: words
  min_words: 500
  max_words: 650
  require_nonempty: true
baselines:
  pacsum:
    beta: 0.0
    lambda_previous: -0.7
    lambda_following: 0.3
    tfidf:
      lowercase: true
      sublinear_tf: false
      ngram_range: [1, 1]
      stop_words: null
  sbert_mmr:
    lambda_relevance: 0.9
final_protocol:
  study_id: govreport-centered-final-evaluation-v1
  preregistration_path: configs/preregistrations/govreport_centered_final_evaluation_v1.json
  authorization_path: configs/data_policies/govreport_test_authorization_v1.json
  one_shot: true
  scientific_source_config_sha256: c2088ca4dd794ba08c4c9544d4d75f323c4c3fd749dbac7cdf4b611da60bd481
