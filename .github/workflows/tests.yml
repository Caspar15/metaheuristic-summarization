name: Unit tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install unit-test dependencies
        run: |
          python -m pip install --upgrade pip
          # The representation/cache contract tests exercise tensor operations
          # without downloading a model.  Use the CPU wheel explicitly so CI
          # does not pull CUDA runtime packages from the default index.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r requirements-ci.txt

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Run unit tests
        run: python -m pytest -q
